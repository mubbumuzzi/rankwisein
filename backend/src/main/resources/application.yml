spring:
  application:
    name: rankwise-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:sqlserver://localhost:1433;databaseName=rankwise;encrypt=true;trustServerCertificate=true}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:Rankwise@Admin123}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.SQLServerDialect
        jdbc:
          batch_size: 1000
        order_inserts: true
  flyway:
    enabled: true
    baseline-on-migrate: true
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

server:
  port: 8080

app:
  jwt:
    secret: ${JWT_SECRET:rankwise-super-secret-key-change-me-in-production-0123456789abcdef}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  admin:
    username: ${ADMIN_USERNAME:admin}
    email: ${ADMIN_EMAIL:admin@rankwise.local}
    password: ${ADMIN_PASSWORD:admin123}
  pdf-import:
    storage-dir: ${IMPORT_STORAGE_DIR:./data/imports}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost}
  cursor:
    api-key: ${CURSOR_API_KEY:}
    model: ${CURSOR_MODEL:composer-2.5}
    enabled: ${CURSOR_ENABLED:true}
    poll-interval-ms: ${CURSOR_POLL_INTERVAL_MS:1500}
    max-wait-ms: ${CURSOR_MAX_WAIT_MS:120000}
    agent-name-prefix: ${CURSOR_AGENT_NAME_PREFIX:RankWise}
  chat:
    rate-limit-per-hour: ${CHAT_RATE_LIMIT_PER_HOUR:60}
    max-message-length: ${CHAT_MAX_MESSAGE_LENGTH:2000}
    lead-cta-after-messages: ${CHAT_LEAD_CTA_AFTER:4}
    rag-max-articles: ${CHAT_RAG_MAX_ARTICLES:4}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    com.rankwise: INFO
